<!DOCTYPE html><html><head><title>Liquid glass tab bar</title><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:800px;height:600px;overflow:hidden;}
canvas{display:block;}
.ui{position:absolute;inset:0;font-family:Arial,sans-serif}
.ui button{all:unset;position:absolute;display:grid;place-items:center;cursor:pointer;border-radius:50%;color:#eeeef0;-webkit-tap-highlight-color:transparent;transition:background .2s,transform .15s}
.ui button:focus-visible{outline:2px solid #6aa8ff;outline-offset:2px}
.ui button:active{transform:scale(.92)}
.ui button svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
#plus{left:99px;top:272px;width:56px;height:56px;color:#fff}
#plus svg{width:28px;height:28px}
#q{position:absolute;left:168px;top:278px;width:316px;height:44px;background:transparent;border:0;outline:0;color:#e8e8ea;font:400 23px Arial,sans-serif;letter-spacing:-.02em;caret-color:#fff}
#q::placeholder{color:rgb(185,186,188)}
#mic{left:479px;top:277px;width:66px;height:46px;border-radius:23px}
#mic svg{width:34px;height:34px}
#wave{left:555px;top:277px;width:66px;height:46px;border-radius:23px}
#wave svg{width:34px;height:34px}
#x{left:651px;top:264px;width:73px;height:73px;color:#d1d1d3}
#x svg{width:24px;height:24px}
.ui button.on{background:rgba(255,255,255,.16);color:#fff}
#mic.on svg{animation:pulse 1s ease-in-out infinite}
#wave.on svg line{animation:bar .7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#wave.on svg line:nth-child(2){animation-delay:.1s}#wave.on svg line:nth-child(3){animation-delay:.2s}#wave.on svg line:nth-child(4){animation-delay:.3s}#wave.on svg line:nth-child(5){animation-delay:.4s}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes bar{50%{transform:scaleY(.45)}}
#st{position:absolute;left:168px;top:344px;font:500 13px Arial,sans-serif;color:rgba(255,255,255,.75);opacity:0;transition:opacity .2s}
#st.show{opacity:1}

</style></head><body>
<canvas id="c" width="800" height="600"></canvas>
<div class="ui">
<button id="plus" aria-label="Add attachment"><svg viewBox="0 0 28 28" stroke-width="3"><path d="M3 14h22M14 3v22"/></svg></button>
<input id="q" type="text" placeholder="Ask AI" aria-label="Ask AI" autocomplete="off">
<button id="mic" aria-label="Record voice" aria-pressed="false"><svg viewBox="0 0 34 34" stroke-width="2.2"><rect x="13" y="5" width="9" height="16" rx="4.5"/><path d="M8 16a9.5 9.5 0 0 0 19 0M17.5 26v3"/></svg></button>
<button id="wave" aria-label="Voice mode" aria-pressed="false"><svg viewBox="0 0 34 34" stroke-width="2.4"><line x1="6" y1="14" x2="6" y2="20"/><line x1="12" y1="9" x2="12" y2="25"/><line x1="18" y1="5" x2="18" y2="29"/><line x1="24" y1="10" x2="24" y2="24"/><line x1="29" y1="14" x2="29" y2="20"/></svg></button>
<button id="x" aria-label="Clear"><svg viewBox="0 0 24 24" stroke-width="2.6"><path d="M4 4l16 16M20 4L4 20"/></svg></button>
<div id="st" role="status"></div>
</div>
<script>
(function(){
 var q=document.getElementById('q'),mic=document.getElementById('mic'),wave=document.getElementById('wave'),st=document.getElementById('st');
 function say(t){st.textContent=t;st.classList.toggle('show',!!t)}
 function tog(b,label){var on=!b.classList.contains('on');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);say(on?label:'');return on}
 mic.onclick=function(){wave.classList.remove('on');tog(mic,'Recording...')};
 wave.onclick=function(){mic.classList.remove('on');tog(wave,'Listening...')};
 document.getElementById('plus').onclick=function(){q.focus()};
 document.getElementById('x').onclick=function(){q.value='';mic.classList.remove('on');wave.classList.remove('on');say('');q.focus()};
 q.addEventListener('keydown',function(e){if(e.key==='Enter'&&q.value.trim()){say('Sent: '+q.value.trim().slice(0,28));q.value=''}});
})();
</script>

function hash2(x,y){ let n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function vnoise(x,y){ // smooth value noise
  const xi=Math.floor(x), yi=Math.floor(y), fx=x-xi, fy=y-yi;

  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;
}
function patchV(x,y){ const n=vnoise(x/85+3.1,y/85+7.7)*0.65+vnoise(x/38+11.3,y/38+1.9)*0.35; return Math.min(1,Math.max(0,(n-0.32)*2.4)); }
function patchH(x,y){ const n=vnoise(x/95+17.3,y/95+3.7)*0.65+vnoise(x/42+5.9,y/42+13.1)*0.35; return Math.min(1,Math.max(0,(n-0.34)*2.4)); }
function zoneF(gx,gy,ch){ // bilinear over zone centers
  const zx=Math.min(7,Math.max(0,gx)), zy=Math.min(5,Math.max(0,gy));
  const x0=Math.floor(zx), y0=Math.floor(zy), fx=zx-x0, fy=zy-y0;
  const x1=Math.min(7,x0+1), y1=Math.min(5,y0+1);
  const a=ZONES[y0][x0][ch], b=ZONES[y0][x1][ch], c=ZONES[y1][x0][ch], d=ZONES[y1][x1][ch];
  return a*(1-fx)*(1-fy)+b*fx*(1-fy)+c*(1-fx)*fy+d*fx*fy;
}
{
  const img=s.createImageData(W,H), D=img.data;
  for(let y=0;y<H;y++){
    const gy=(y-50)/100+0.0;
    const wvY=WH[((y+PH)%9+9)%9];
    for(let x=0;x<W;x++){
      const gx=(x-50)/100+0.0;
      const base=zoneF(gx,gy,0), av=zoneF(gx,gy,1), ah=zoneF(gx,gy,2);
      const sv=WV[((x+PV)%9+9)%9];
      const pv2=patchV(x,y), ph2=patchH(x,y);
      const v=base + av*pv2*sv*1.9 + ah*ph2*wvY*1.55 + 4.0*av*ah*pv2*ph2*sv*wvY/24;

    }
  }
  // soften like the ref's fabric
  const t=document.createElement('canvas'); t.width=W; t.height=H;
  t.getContext('2d').putImageData(img,0,0);

}

glass4(Object.assign({sdf:sdfRR(356.5,299.5,281.5,54.5,54.5),x0:60,y0:230,x1:660,y1:372,shadowK:0.3,shadowDX:0,shadowDY:3,shadowBlur:2.5,brGlow:0.22,brGX:618,brGY:346,brGR:12},frosty4));
glass4(Object.assign({sdf:sdfRR(687.5,300,36.5,36.5,36.5),x0:640,y0:252,x1:735,y1:348},Object.assign({},frosty4,{tint:[24,24,28],tintMix:0.62,frostMix:0.45,rimT:56,rimB:30,rimR:9,rimL:17,fresK:0.03,sp1K:0.3,sp2K:0.2})));
ctx.drawImage(sc,0,0);
