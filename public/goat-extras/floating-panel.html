<!doctype html><meta charset=utf-8><title>Floating panel (own code)</title>
<style>@font-face{font-family:GOATText;src:url(/goat-extras/GOATText.woff2) format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#fff;font:16px/24px GOATText,system-ui,sans-serif;color:#000;text-rendering:geometricprecision;-webkit-font-smoothing:antialiased}
#open{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:34px;padding:4px 16px;background:#fff;border:1px solid #e4e4e7;font:500 16px/24px GOATText,system-ui,sans-serif;color:#000;cursor:pointer}
#p{position:fixed;filter:drop-shadow(0 1px 2px rgba(0,0,0,.24));background:#fff;border:1px solid #e4e4e7;z-index:1000000}
#p[hidden]{display:none}
#h{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 16px;border-bottom:1px solid #e4e4e7;cursor:move;user-select:none;touch-action:none;background:#fff}
#h p{font-weight:500}
#c{display:flex;align-items:center}
#c button{width:24px;height:24px;border:0;border-radius:4px;background:transparent;display:flex;align-items:center;justify-content:center;color:#000;cursor:default;font:inherit;transition:all .15s}
#c button:hover{background:#f4f4f5}
#c button[hidden]{display:none}
#b{position:relative;padding:16px;display:flex;flex-direction:column;gap:16px;overflow:auto;height:calc(100% - 41px)}
#p.min #b{display:none}#p.min{overflow:hidden}
label{display:block;font-size:14px;line-height:21px;font-weight:500}
label span{display:block}
select,input{display:block;width:100%;height:32px;margin-top:4px;padding:0 8px;background:#fff;border:1px solid #e4e4e7;border-radius:4px;font:500 14px GOATText,system-ui,sans-serif;color:#000}
.r{position:absolute;touch-action:none}
.r[data-a=n]{width:100%;top:0;left:50%;translate:-50%;cursor:n-resize;height:6px}
.r[data-a=s]{width:100%;bottom:0;left:50%;translate:-50%;cursor:s-resize;height:6px}
.r[data-a=e]{height:100%;right:0;top:50%;translate:0 -50%;cursor:e-resize;width:6px}
.r[data-a=w]{height:100%;left:0;top:50%;translate:0 -50%;cursor:w-resize;width:6px}
.r[data-a=ne]{top:0;right:0;cursor:ne-resize;width:10px;height:10px}
.r[data-a=se]{bottom:0;right:0;cursor:se-resize;width:10px;height:10px}
.r[data-a=sw]{bottom:0;left:0;cursor:sw-resize;width:10px;height:10px}
.r[data-a=nw]{top:0;left:0;cursor:nw-resize;width:10px;height:10px}
</style>
<button id=open>Open Panel</button>
<div id=p hidden role=dialog aria-label="Variables"><div id=h><p>Variables</p><div id=c>
<button data-s=min aria-label="Minimize window"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12L4 12" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"/></svg></button>
<button data-s=max aria-label="Maximize window"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.4999 3.26621C17.3443 3.25421 20.1408 2.67328 20.7337 3.26621C21.3266 3.85913 20.7457 6.65559 20.7337 7.5M20.5059 3.49097L13.5021 10.4961" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"/><path d="M3.26636 16.5001C3.25436 17.3445 2.67343 20.141 3.26636 20.7339C3.85928 21.3268 6.65574 20.7459 7.50015 20.7339M10.502 13.4976L3.49824 20.5027" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"/></svg></button>
<button data-s=res aria-label="Restore window" hidden><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17.3497C15 17.3497 8.06166 17.8924 7.08461 16.9154C6.10755 15.9383 6.65037 9 6.65037 9M7.5 16.5L17.5 6.5" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"/></svg></button>
<button data-s=x aria-label="Close Window"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.9991 19L5 5.00098" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"/><path d="M19 5L5.00092 18.999" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"/></svg></button></div></div>
<div id=b><label><span>Font Family</span><select><option>Sans Serif</option><option>Serif</option><option>Monospace</option></select></label>
<label><span>Font Size</span><input type=number value=16></label></div><div class=r data-a=n></div><div class=r data-a=e></div><div class=r data-a=w></div><div class=r data-a=s></div><div class=r data-a=ne></div><div class=r data-a=se></div><div class=r data-a=sw></div><div class=r data-a=nw></div></div>
<script>
const P=document.getElementById('p'),O=document.getElementById('open'),H=document.getElementById('h');
let R={x:0,y:0,w:320,h:240},st='def',prev=null;
const place=()=>{if(st=='max'){P.style.cssText='left:0;top:0;width:'+innerWidth+'px;height:'+innerHeight+'px'}
else{const h=st=='min'?41:R.h;P.style.cssText='left:'+R.x+'px;top:'+R.y+'px;width:'+R.w+'px;height:'+h+'px'}
P.classList.toggle('min',st=='min');
P.querySelector('[data-s=min]').hidden=st!='def';P.querySelector('[data-s=max]').hidden=st!='def';P.querySelector('[data-s=res]').hidden=st=='def'};
O.onclick=()=>{R={w:320,h:240,x:Math.round((innerWidth-320)/2),y:Math.round((innerHeight-240)/2)};st='def';P.hidden=false;place()};
P.querySelector('#c').onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=b.dataset.s;
if(s=='min')st='min';else if(s=='max')st='max';else if(s=='res')st='def';else{P.hidden=true;return}place()};
const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
function track(e,move){const ox=e.clientX,oy=e.clientY,s={...R};e.target.setPointerCapture&&0;
const mv=ev=>{const x=cl(ev.clientX,0,innerWidth),y=cl(ev.clientY,0,innerHeight);move(x-ox,y-oy,s);place()};
const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)}
H.addEventListener('pointerdown',e=>{if(e.target.closest('button')||st=='max'||e.button)return;e.preventDefault();track(e,(dx,dy,s)=>{R.x=s.x+dx;R.y=Math.max(0,s.y+dy)})});
P.querySelectorAll('.r').forEach(r=>{r.addEventListener('pointerdown',e=>{if(st!='def'||e.button)return;e.preventDefault();const a=r.dataset.a;
track(e,(dx,dy,s)=>{let{x,y,w,h}=s;
if(a.includes('e'))w=Math.max(2,s.w+dx);if(a.includes('s'))h=Math.max(2,s.h+dy);
if(a.includes('w')){w=Math.max(2,s.w-dx);x=s.x+s.w-w}if(a.includes('n')){h=Math.max(2,s.h-dy);y=s.y+s.h-h}
R={x:Math.max(0,x),y:Math.max(0,y),w,h}})})});
</script>
