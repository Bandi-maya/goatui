<!doctype html>
<!-- GOAT block: coming-soon-1. Own code. Coming soon page with email notify form, light + dark. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">@custom-variant dark (&:where(.dark, .dark *));</style>
</head>
<body class="flex min-h-screen items-center justify-center p-6 dark:bg-gray-900">
<div class="max-w-md text-center">
    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Coming soon!</h2>
    <p class="mt-4 text-pretty text-gray-700 dark:text-gray-200">We're working on something exciting. Be the first to know when it launches.</p>
    <form class="mt-6 space-y-2">
        <input type="email" autocomplete="email" placeholder="your@email.com" class="w-full rounded-lg border-gray-300 px-4 py-3 text-sm focus:border-blue-500 focus:outline-hidden dark:border-gray-600 dark:bg-gray-900 dark:text-white">
        <button class="block w-full rounded-lg bg-blue-600 px-6 py-3 text-sm font-medium text-white transition-colors hover:bg-blue-700">Notify Me</button>
    </form>
    <p class="mt-6 text-sm text-gray-700 dark:text-gray-200">We'll let you know the moment it's available.</p>
</div>
</body>
</html>
