<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOAT UI — CTA Split 01</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.0.2/tailwind.min.css">
<style>
body{margin:0}
.dark .ctas-sec{background-color:#111827;color:#9ca3af}
.dark .ctas-h1{color:#fff}
.dark .ctas-card{background-color:rgba(31,41,55,0.5)}
.dark .ctas-h2{color:#fff}
.dark .ctas-label{color:#9ca3af}
.dark .ctas-input{background-color:rgba(75,85,99,0.2);border-color:#4b5563;color:#f3f4f6}
.dark .ctas-note{color:#9ca3af}
</style>
</head>
<body>
<section class="ctas-sec text-gray-600 body-font">
  <div class="container px-5 py-24 mx-auto flex flex-wrap items-center">
    <div class="lg:w-3/5 md:w-1/2 md:pr-16 lg:pr-0 pr-0">
      <h1 class="ctas-h1 title-font font-medium text-3xl text-gray-900">
        Slow-carb next level shoindcgoitch ethical authentic, poko scenester
      </h1>
      <p class="leading-relaxed mt-4">
        Poke slow-carb mixtape knausgaard, typewriter street art gentrify
        hammock starladder roathse. Craies vegan tousled etsy austin.
      </p>
    </div>
    <div class="ctas-card lg:w-2/6 md:w-1/2 bg-gray-100 rounded-lg p-8 flex flex-col md:ml-auto w-full mt-10 md:mt-0">
      <h2 class="ctas-h2 text-gray-900 text-lg font-medium title-font mb-5">Sign Up</h2>
      <div class="relative mb-4">
        <label for="full-name" class="ctas-label leading-7 text-sm text-gray-600">Full Name</label>
        <input type="text" id="full-name" name="full-name" class="ctas-input w-full bg-white rounded border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
      </div>
      <div class="relative mb-4">
        <label for="email" class="ctas-label leading-7 text-sm text-gray-600">Email</label>
        <input type="email" id="email" name="email" class="ctas-input w-full bg-white rounded border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
      </div>
      <button class="text-white bg-blue-500 border-0 py-2 px-8 focus:outline-none hover:bg-blue-600 rounded text-lg">Button</button>
      <p class="ctas-note text-xs text-gray-500 mt-3">Literally you probably haven't heard of them jean shorts.</p>
    </div>
  </div>
</section>
</body>
</html>
