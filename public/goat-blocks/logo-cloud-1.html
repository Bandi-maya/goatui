<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOAT UI — Logo Cloud 01</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>body{margin:0}</style>

        <div class="grid place-content-center p-4 grayscale transition-[filter] hover:grayscale-0 dark:opacity-70 dark:brightness-0 dark:invert dark:transition-[filter,opacity] dark:hover:opacity-100">

    </div>
  </div>
