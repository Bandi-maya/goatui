<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOAT UI — Stats with Chart 01</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">@custom-variant dark (&:where(.dark, .dark *));</style>
</head>
<body class="mx-auto flex max-w-lg flex-col gap-4 p-6 dark:bg-gray-900">
<article class="flex items-center justify-between gap-4 rounded-lg border border-gray-100 bg-white p-6 dark:border-gray-800 dark:bg-gray-900">
  <div>
    <strong class="block text-sm font-medium text-gray-600 dark:text-gray-300">Active customers</strong>
    <p class="mt-1 text-2xl font-medium text-gray-900 dark:text-white">2,318</p>
    <div class="mt-2">
      <div class="inline-flex gap-2 rounded-sm bg-green-100 p-1 text-green-800 dark:bg-green-800 dark:text-green-100">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
        </svg>
        <span class="sr-only">Increase: </span>
        <span class="text-xs font-medium">4.1%</span>
      </div>
    </div>
  </div>
  <div class="h-16 w-32 shrink-0">
    <canvas id="spark-customers" role="img" aria-label="Active customers over the last six months, rising from 1,840 to 2,318"></canvas>
  </div>
</article>

<article class="flex items-center justify-between gap-4 rounded-lg border border-gray-100 bg-white p-6 dark:border-gray-800 dark:bg-gray-900">
  <div>
    <strong class="block text-sm font-medium text-gray-600 dark:text-gray-300">Refund rate</strong>
    <p class="mt-1 text-2xl font-medium text-gray-900 dark:text-white">3.2%</p>
    <div class="mt-2">
      <div class="inline-flex gap-2 rounded-sm bg-red-100 p-1 text-red-700 dark:bg-red-800 dark:text-red-200">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
        </svg>
        <span class="sr-only">Decrease: </span>
        <span class="text-xs font-medium">1.4%</span>
      </div>
    </div>
  </div>
  <div class="h-16 w-32 shrink-0">
    <canvas id="spark-refunds" role="img" aria-label="Refund rate over the last six months, falling from 4.6% to 3.2%"></canvas>
  </div>
</article>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script>
  const baseOptions = {
    animation: false,
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { enabled: false } },
  }

  function sparkline(id, values, stroke, fill) {
    return new Chart(document.getElementById(id), {
      type: 'line',
      data: {
        labels: values.map((_, i) => i + 1),
        datasets: [{
          data: values,
          borderColor: stroke,
          backgroundColor: fill,
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.35,
          fill: Boolean(fill),
        }],
      },
      options: {
        ...baseOptions,
        layout: { padding: 2 },
        scales: {
          x: { display: false },
          y: { display: false, min: Math.min(...values), max: Math.max(...values) },
        },
      },
    })
  }

  let charts = []

  function renderSparklines() {
    charts.forEach((c) => c.destroy())
    charts = []
    const isDark = document.documentElement.classList.contains('dark')
    charts.push(sparkline(
      'spark-customers',
      [1840, 1920, 1990, 2100, 2227, 2318],
      isDark ? '#6ee7b7' : '#059669',
      isDark ? 'rgba(52, 211, 153, 0.15)' : 'rgba(16, 185, 129, 0.15)',
    ))
    charts.push(sparkline(
      'spark-refunds',
      [4.6, 4.4, 4.5, 3.9, 3.6, 3.2],
      isDark ? '#fda4af' : '#e11d48',
      isDark ? 'rgba(251, 113, 133, 0.15)' : 'rgba(244, 63, 94, 0.15)',
    ))
  }

  renderSparklines()
  new MutationObserver(renderSparklines).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['class'],
  })
</script>
</body>
</html>
